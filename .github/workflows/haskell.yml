name: Haskell CI

on:
  push:
    paths:
      - 'app/**'
      - 'src/**'
      - 'test/**'
      - 'prelude/**'
      - 'rules/**'
      - 'examples/**'
      - '**.cabal'
      - '.github/workflows/haskell.yml'

  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The example corpus is behind the `examples` flag so that an ordinary push
      # does not pay its ~70 s, and so that it can neither pass silently nor be
      # skipped silently -- his instruction, 2026-10-12, and the flag is the whole
      # of the opt-in.
      #
      # A pull request pays it. That is the run whose green tick stands for what
      # lands in `main`, and until 2026-11-10 no pull request had ever loaded
      # `examples/` at all: `cabal test all` with no flags cannot, because the
      # suite is `buildable: False` without one.
      #
      # It is one configuration per run rather than a second test step, because
      # changing the flag set makes cabal reconfigure and rebuild the library --
      # so a step that added the flag afterwards would pay for the whole build
      # twice. Empty on a push, where the commands are then exactly as they were.
      CORPUS: ${{ github.event_name == 'pull_request' && '--flags=examples' || '' }}

    steps:
      - uses: actions/checkout@v4

      # GHC 9.12 or newer is required: the cabal file asks for the GHC2024
      # language edition, which arrived in 9.10, and for base ^>=4.21.2.0,
      # which ships with 9.12. Pinned to the version the project is developed
      # against so that a -Wall-clean build here means the same thing it means
      # locally.
      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.12.4'
          cabal-version: 'latest'

      # Dependencies only, and deliberately NOT dist-newstyle: cabal decides
      # what to recompile by hashing file contents, so a cached build tree would
      # leave unchanged modules uncompiled and their warnings unprinted. That is
      # the exact way -Wall went unchecked for two phases locally. alex, happy
      # and tasty are most of the cold-build time and they live in the store.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project*') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ steps.setup.outputs.ghc-version }}-

      - name: Install dependencies
        run: |
          cabal update
          cabal build --only-dependencies --enable-tests all $CORPUS

      - name: Build
        run: cabal build --enable-tests all $CORPUS

      # --test-show-details=direct so a failing golden's diff reaches the log;
      # cabal hides test output otherwise and the run is useless when it is red.
      # On a pull request this includes `thena-examples`, which loads the whole
      # numbered series in one session and proves its headline theorems.
      - name: Run tests
        run: cabal test all --test-show-details=direct $CORPUS
